name: Build nextcloud-ocr

# CVE-Scan (Grype):
#   - nach jedem Build
#   - zusätzlich jeden Montag, auch ohne Build (neue CVEs im alten Image)
#   - bei jedem manuellen Start
# Gemeldet wird nur CRITICAL/HIGH, für das es einen Fix gibt. Dann wird der
# Scan-Job rot und GitHub schickt eine Mail. Das Image wird trotzdem
# veröffentlicht - ein neueres Image ist fast immer besser als das alte.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'   # täglich 03:30 UTC prüfen
    - cron: '45 4 * * 1'   # montags 04:45 UTC: CVE-Scan auch ohne Build
  workflow_dispatch:
    inputs:
      force:
        description: "Build erzwingen (ignoriert die Änderungsprüfung)"
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/christiantannheimer/nextcloud-ocr

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-nextcloud-ocr
      cancel-in-progress: false
    permissions:
      packages: write
      contents: write        # zum Committen der State-Datei
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- Zustand ermitteln: Base-Image-Digest + Paketversionen + Quelldateien ----
      - name: Aktuellen Zustand ermitteln
        id: state
        run: |
          set -euo pipefail

          # Single source of truth: das FROM im Dockerfile
          BASE=$(grep -m1 -oP '^FROM \K\S+' Dockerfile)
          echo "Basis-Image: $BASE"

          DIGEST=$(docker buildx imagetools inspect "$BASE" \
            --format '{{println .Manifest.Digest}}' | head -n1)
          [ -n "$DIGEST" ] || { echo "Digest leer"; exit 1; }

          PKGS=$(docker run --rm "$BASE" bash -c \
            'apt-get update -qq >/dev/null 2>&1 && \
             apt-cache policy ocrmypdf tesseract-ocr-deu tesseract-ocr-eng | \
             grep -E "^(ocrmypdf|tesseract)|Candidate"')
          [ -n "$PKGS" ] || { echo "Paketabfrage leer"; exit 1; }

          # Build-Kontext einbeziehen -> Dockerfile-Änderung löst Build aus
          SRC=$(git ls-files -s Dockerfile entrypoint.sh | sha256sum | cut -d' ' -f1)

          HASH=$(printf '%s\n%s\n%s' "$DIGEST" "$PKGS" "$SRC" | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

          printf 'Digest: %s\nSrc: %s\n%s\n' "$DIGEST" "$SRC" "$PKGS"

      - name: Mit letztem Build vergleichen
        id: compare
        run: |
          LAST=$(cat .build-state 2>/dev/null || echo "none")
          echo "Letzter Build: $LAST"
          echo "Aktuell:       ${{ steps.state.outputs.hash }}"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Build manuell erzwungen"
          elif [ "$LAST" != "${{ steps.state.outputs.hash }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Änderung erkannt -> Build"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine Änderung -> kein Build"
          fi

      # ---- Nur bei Änderung bauen & pushen ----
      - name: Login GHCR
        if: steps.compare.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        if: steps.compare.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}

      - name: Neuen Zustand committen
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "${{ steps.state.outputs.hash }}" > .build-state
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .build-state
          git diff --cached --quiet && exit 0
          git commit -m "build: $(date -u +%F) [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

  scan:
    needs: check-and-build
    # always(): läuft auch beim Montags-Scan ohne Build.
    # Ist check-and-build fehlgeschlagen, kommt dafür schon eine eigene Mail.
    if: >-
      always() &&
      needs.check-and-build.result == 'success' &&
      (needs.check-and-build.outputs.changed == 'true' ||
       github.event.schedule == '45 4 * * 1' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # Grype liest die Zugangsdaten aus der Docker-Config,
      # nötig falls das Package auf ghcr.io privat ist.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: CVE-Scan (Grype)
        # Auf Commit gepinnt (v7.4.2), nicht auf den Tag.
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:latest
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table
